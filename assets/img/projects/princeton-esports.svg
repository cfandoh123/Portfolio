<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Princeton Esports">
  <defs>
    <linearGradient id="pe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14171c"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <radialGradient id="pe-glow" cx="0.82" cy="0.18" r="0.62">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pe-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#fbbf47"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#pe-bg)"/>
  <rect width="1600" height="1000" fill="url(#pe-glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 250H1600M0 500H1600M0 750H1600M400 0V1000M800 0V1000M1200 0V1000"/>
  </g>

  <g transform="translate(120 300)">
    <rect x="0" y="0" width="64" height="4" rx="2" fill="url(#pe-accent)"/>
    <text x="88" y="10" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="26" letter-spacing="4" fill="#ff8c3c">SWIFTUI · REACT</text>

    <text y="150" font-family="'Quicksand', 'Inter', system-ui, sans-serif" font-weight="700" font-size="118" fill="#ecebe8">Princeton</text>
    <text y="278" font-family="'Quicksand', 'Inter', system-ui, sans-serif" font-weight="700" font-size="118" fill="url(#pe-accent)">Esports</text>

    <text y="360" font-family="'Inter', system-ui, sans-serif" font-size="34" fill="#9aa1ab">Matchmaking, leaderboards and chat for campus gamers.</text>
  </g>

  <g transform="translate(120 800)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="24" fill="#9aa1ab">
    <g>
      <rect x="0" y="-30" width="216" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="34" y="4">Dashboard</text>
    </g>
    <g transform="translate(236 0)">
      <rect x="0" y="-30" width="184" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="34" y="4">Ranked</text>
    </g>
    <g transform="translate(440 0)">
      <rect x="0" y="-30" width="152" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="34" y="4">Chat</text>
    </g>
    <g transform="translate(612 0)">
      <rect x="0" y="-30" width="256" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="34" y="4">Tournaments</text>
    </g>
  </g>
