<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="FraudGuard">
  <defs>
    <linearGradient id="fg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14171c"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <radialGradient id="fg-glow" cx="0.78" cy="0.78" r="0.6">
      <stop offset="0%" stop-color="#fb8c3c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fb8c3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fg-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb8c3c"/>
      <stop offset="100%" stop-color="#fbbf47"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#fg-bg)"/>
  <rect width="1600" height="1000" fill="url(#fg-glow)"/>

  <!-- transaction stream with one flagged above the decision threshold -->
  <g transform="translate(1010 340)">
    <line x1="-10" y1="200" x2="400" y2="200" stroke="#fb8c3c" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="10 10"/>
    <text x="404" y="208" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="20" fill="#fb8c3c" opacity="0.8">τ</text>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="10" y="250" width="34" height="70" rx="6"/>
      <rect x="64" y="222" width="34" height="98" rx="6"/>
      <rect x="118" y="266" width="34" height="54" rx="6"/>
      <rect x="172" y="236" width="34" height="84" rx="6"/>
      <rect x="280" y="258" width="34" height="62" rx="6"/>
      <rect x="334" y="230" width="34" height="90" rx="6"/>
    </g>
    <rect x="226" y="96" width="34" height="224" rx="6" fill="url(#fg-accent)"/>
    <circle cx="243" cy="52" r="17" fill="none" stroke="#fbbf47" stroke-width="4"/>
    <path d="M243 44v10M243 60v1" stroke="#fbbf47" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(120 300)">
    <rect x="0" y="0" width="64" height="4" rx="2" fill="url(#fg-accent)"/>
    <text x="88" y="10" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="26" letter-spacing="4" fill="#fb8c3c">ANDROID · JAVA</text>

    <text y="150" font-family="'Quicksand', 'Inter', system-ui, sans-serif" font-weight="700" font-size="118" fill="#ecebe8">Fraud<tspan fill="url(#fg-accent)">Guard</tspan></text>

    <text y="242" font-family="'Inter', system-ui, sans-serif" font-size="34" fill="#9aa1ab">Scoring card transactions the moment they land.</text>
  </g>

  <g transform="translate(120 800)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="24" fill="#9aa1ab">
    <g>
      <rect x="0" y="-30" width="224" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="34" y="4">On-device</text>
    </g>
    <g transform="translate(244 0)">
      <rect x="0" y="-30" width="288" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="34" y="4">Remote scoring</text>
    </g>
    <g transform="translate(552 0)">
      <rect x="0" y="-30" width="216" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="34" y="4">Dashboard</text>
    </g>
  </g>
</svg>
